name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install analysis tools
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Check source and standalone release
        run: |
          bash -n sing-box-deploy.sh
          shellcheck sing-box-deploy.sh
          ruff check .
          python scripts/build_release.py --output dist/sing-box-deploy.sh
          bash -n dist/sing-box-deploy.sh
          shellcheck dist/sing-box-deploy.sh

  tests:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'fedora:43']
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install distribution dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends bash git python3 openssl curl ca-certificates iproute2 diffutils
          else
            dnf install -y bash git python3 openssl curl ca-certificates iproute diffutils
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fast module and packaging tests
        run: python3 -B tests/run_tests.py --group fast
      - name: Isolated system regression tests
        if: github.event_name != 'pull_request'
        run: python3 -B tests/run_tests.py --group slow
